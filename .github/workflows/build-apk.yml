name: Build APK from ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o ZIP
        run: |
          unzip -q CodeDownloader.zip -d extracted
          ROOT=$(dirname "$(find extracted -name settings.gradle.kts | head -n1)")
          echo "Projeto encontrado em: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK debug
        run: |
          cd "$ROOT"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CodeDownloader-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
